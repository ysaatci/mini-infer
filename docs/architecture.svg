<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <style>
    .bg { fill: #fcfcfb; }
    .box { fill: #ffffff; stroke: #c3c2b7; stroke-width: 1; }
    .hot { fill: #eef4fc; stroke: #2a78d6; stroke-width: 1.2; }
    .file { fill: #0b0b0b; font-size: 13px; font-weight: 600; font-family: Consolas, ui-monospace, monospace; }
    .desc { fill: #52514e; font-size: 12px; }
    .edge { stroke: #898781; stroke-width: 1.5; fill: none; }
    .head { fill: #898781; }
    .note { fill: #898781; font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .box { fill: #232322; stroke: #383835; }
      .hot { fill: #1c2a3d; stroke: #3987e5; }
      .file { fill: #ffffff; }
      .desc { fill: #c3c2b7; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" class="head"/>
    </marker>
  </defs>
  <rect class="bg" width="760" height="470" rx="8"/>

  <!-- Row 1: client and HTTP server -->
  <rect class="box" x="20" y="20" width="170" height="56" rx="6"/>
  <text class="file" x="34" y="44">client</text>
  <text class="desc" x="34" y="63">openai SDK, curl</text>

  <rect class="box" x="250" y="20" width="490" height="56" rx="6"/>
  <text class="file" x="264" y="44">server.py · protocol.py · detokenizer.py</text>
  <text class="desc" x="264" y="63">FastAPI event loop: OpenAI API, SSE streaming, text deltas</text>
  <path class="edge" d="M190,48 L246,48" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Row 2: async bridge -->
  <rect class="box" x="250" y="110" width="490" height="56" rx="6"/>
  <text class="file" x="264" y="134">async_engine.py</text>
  <text class="desc" x="264" y="153">engine thread; add/abort through an inbox, tokens back per request</text>
  <path class="edge" d="M495,76 L495,106" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Row 3: engine with scheduler and speculative decoder -->
  <rect class="hot" x="250" y="200" width="490" height="56" rx="6"/>
  <text class="file" x="264" y="224">engine.py</text>
  <text class="desc" x="264" y="243">step(): prefill new requests, or decode the batch</text>
  <path class="edge" d="M495,166 L495,196" marker-end="url(#arrow)"/>

  <rect class="box" x="20" y="200" width="200" height="56" rx="6"/>
  <text class="file" x="34" y="224">scheduler.py</text>
  <text class="desc" x="34" y="243">admission, blocks, preemption</text>
  <path class="edge" d="M220,228 L246,228" marker-start="url(#arrow)"/>

  <rect class="box" x="20" y="290" width="200" height="74" rx="6"/>
  <text class="file" x="34" y="314">speculative.py</text>
  <text class="desc" x="34" y="333">0.5B drafts, 1.5B verifies,</text>
  <text class="desc" x="34" y="350">rejection sampling, rollback</text>
  <path class="edge" d="M300,256 L300,274 L120,274 L120,286" marker-end="url(#arrow)"/>
  <path class="edge" d="M390,256 L390,286" marker-end="url(#arrow)"/>

  <!-- Row 4: graphs and model -->
  <rect class="box" x="250" y="290" width="200" height="74" rx="6"/>
  <text class="file" x="264" y="314">cuda_graphs.py</text>
  <text class="desc" x="264" y="333">decode and verify steps</text>
  <text class="desc" x="264" y="350">replayed as recorded graphs</text>

  <rect class="box" x="490" y="290" width="250" height="74" rx="6"/>
  <text class="file" x="504" y="314">model.py · quant.py</text>
  <text class="desc" x="504" y="333">Qwen2 forward; optional int8</text>
  <text class="desc" x="504" y="350">weights (Triton matmul)</text>
  <path class="edge" d="M560,256 L560,286" marker-end="url(#arrow)"/>
  <path class="edge" d="M450,327 L486,327" marker-end="url(#arrow)"/>

  <!-- Row 5: attention and cache -->
  <rect class="hot" x="250" y="398" width="200" height="56" rx="6"/>
  <text class="file" x="264" y="422">kernels.py</text>
  <text class="desc" x="264" y="441">Triton paged attention</text>

  <rect class="box" x="490" y="398" width="250" height="56" rx="6"/>
  <text class="file" x="504" y="422">paged_cache.py</text>
  <text class="desc" x="504" y="441">16-token blocks, block tables</text>
  <path class="edge" d="M615,364 L615,394" marker-end="url(#arrow)"/>
  <path class="edge" d="M450,426 L486,426" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <path class="edge" d="M560,364 L560,380 L350,380 L350,394" marker-end="url(#arrow)"/>
</svg>
